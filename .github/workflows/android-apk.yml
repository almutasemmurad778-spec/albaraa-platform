name: Build Android 15 APK
on:
  push:
    branches: [android-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android 15 settings
        working-directory: binance-ai-bridge
        run: |
          grep -q 'targetSdk 35' app/build.gradle
          grep -q 'compileSdk 35' app/build.gradle
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
      - name: Assemble APK
        working-directory: binance-ai-bridge
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Check APK
        run: test -s binance-ai-bridge/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Binance-AI-Bridge-Android15
          path: binance-ai-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
