name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android 15 target and declared permissions
        run: |
          grep -q 'targetSdk 35' app/build.gradle
          grep -q 'compileSdk 35' app/build.gradle
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
      - name: Assemble APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Check APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Binance-AI-Bridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
